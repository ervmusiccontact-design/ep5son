<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecteur musique</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="paused">
<div id="bg"><i></i><i></i><i></i></div>

<div id="app">
  <section id="left">
    <div id="cover"></div>
    <div id="meta">
      <div><div id="title">—</div><div id="artist">—</div></div>
      <div class="stars" id="mainStars" aria-label="Note"></div>
    </div>
    <div class="bar">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progression">
      <div class="times"><span id="tc">0:00</span><span id="tr">-0:00</span></div>
    </div>
    <div id="ctrl">
      <button id="rep" aria-label="Répéter la playlist"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      <button id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="pp" aria-label="Lecture / pause"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="stop" aria-label="Retour au début"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    </div>
    <div id="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      <input type="range" id="vl" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </section>

  <section id="right">
    <div id="lyrics"></div>
    <div id="nolyr">Paroles indisponibles</div>
  </section>
</div>

<div id="dock">
  <button id="plBtn" aria-label="Playlist et notes" title="Playlist et notes"><svg viewBox="0 0 24 24"><path d="M3 6h14v2H3V6zm0 4h14v2H3v-2zm0 4h9v2H3v-2zm13 0v6l5-3-5-3z"/></svg></button>
</div>

<aside id="pl">
  <header><span>Playlist</span><button id="plClose">Fermer</button></header>
  <div id="list"></div>
</aside>

<audio id="a" preload="metadata"></audio>
<script src="playlist.js"></script>
<script src="script.js"></script>
</body>
</html>
